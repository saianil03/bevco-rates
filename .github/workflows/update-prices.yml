name: Refresh BEVCO prices

on:
  schedule:
    # 02:30 UTC = 08:00 IST, every Monday
    - cron: "30 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch and parse the current price lists
        run: python scripts/update.py

      - name: Commit if prices changed
        run: |
          if [ -z "$(git status --porcelain data.json breakdown.json history.json index.html)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "bevco-bot"
          git config user.email "bevco-bot@users.noreply.github.com"
          git add data.json breakdown.json history.json index.html
          git commit -m "Prices updated $(date -u +%Y-%m-%d)"
          git push
